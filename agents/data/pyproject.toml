[project]
name = "vdagent-data"
version = "0.1.0"
description = "vdagent data agent plugin (deterministic StepSpec path + LiteLLM tool loop for free text)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "vdagent-contracts",
  "python-dotenv>=1.0",
  "litellm>=1.50",
  "mcp>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_data"]
