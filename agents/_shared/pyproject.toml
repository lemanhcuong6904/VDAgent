[project]
name = "vdagent-agentkit"
version = "0.1.0"
description = "vdagent shared toolkit for agent plugins: LLM client with structured output, FakeLLM, MCP client, settings"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "vdagent-contracts",
  "python-dotenv>=1.0",
  "litellm>=1.50",
  "mcp>=1.9",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_agentkit"]
