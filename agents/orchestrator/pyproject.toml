[project]
name = "vdagent-orchestrator"
version = "0.1.0"
description = "vdagent orchestrator agent plugin (Orchestrator v4: plan, dispatch in waves, replan, close)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "vdagent-contracts",
  "vdagent-agentkit",
  "python-dotenv>=1.0",
  "litellm>=1.50",
  "mcp>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_orchestrator"]
