[project]
name = "vdagent-compare"
version = "0.1.0"
description = "vdagent compare agent plugin (LiteLLM tool loop)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "python-dotenv>=1.0",
  "litellm>=1.50",
  "mcp>=1.9",
]

[tool.uv.sources]
vdagent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_compare"]
