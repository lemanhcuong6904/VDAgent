[project]
name = "team6-agents"
version = "1.0.0"
description = "Reference analytics agents (agent-runner.v2) for the Team 6 cAi host"
requires-python = ">=3.11"
dependencies = ["team6-agent-platform"]

[dependency-groups]
# Optional frameworks used by sdk/python/examples; `uv sync --group langchain` to add them.
langchain = ["langchain-core==0.3.79"]

[tool.uv]
package = false

[tool.uv.sources]
team6-agent-platform = { path = "../sdk/python", editable = true }
