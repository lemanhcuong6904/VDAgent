[project]
name = "vdagent-chart"
version = "0.1.0"
description = "VDAgent Chart Agent plugin (StepSpec draw_chart over real artifacts; demo mode opt-in)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "vdagent-contracts",
  "vdagent-agentkit",
  "python-dotenv>=1.0",
  "litellm>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_chart"]
