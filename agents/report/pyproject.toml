[project]
name = "vdagent-report"
version = "0.1.0"
description = "vdagent report agent plugin (LangGraph with a Jev quality gate)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "vdagent-contracts",
  "vdagent-agentkit",
  "python-dotenv>=1.0",
  "langgraph>=1.2",
  "langchain-openai>=1.6",
  "httpx>=0.27",
  "mcp>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_report"]
