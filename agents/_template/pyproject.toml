[project]
name = "vdagent-agent-template"
version = "0.1.0"
description = "vdagent agent plugin template: copy this folder to build an agent plugin (see README.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_template"]
