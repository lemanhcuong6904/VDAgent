services:
  api:
    build: .
    env_file: .env
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      AGENT_PLUGIN_MODULES: ${AGENT_PLUGIN_MODULES:-src/agents/index.ts}
      AGENT_TOOL_MODULES: ${AGENT_TOOL_MODULES:-src/tools/warehouse.ts}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-team6}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-team6}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
