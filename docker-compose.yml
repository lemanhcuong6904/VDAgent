services:
  api:
    build: .
    env_file: .env
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      AGENT_PLUGIN_MODULES: ${AGENT_PLUGIN_MODULES:-src/agents/index.ts}
      AGENT_TOOL_MODULES: ${AGENT_TOOL_MODULES:-src/tools/warehouse.ts}
      AGENT_EXTERNAL_MANIFESTS: ${AGENT_EXTERNAL_MANIFESTS:-}
      PYTHONPATH: /app/sdk/python
      PLATFORM_RUNNER_MODE: api
      AGENT_A2A_ALLOWED_EDGES: ${AGENT_A2A_ALLOWED_EDGES:-}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
  worker:
    build: .
    command: pnpm worker
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      AGENT_PLUGIN_MODULES: ${AGENT_PLUGIN_MODULES:-src/agents/index.ts}
      AGENT_TOOL_MODULES: ${AGENT_TOOL_MODULES:-src/tools/warehouse.ts}
      AGENT_EXTERNAL_MANIFESTS: ${AGENT_EXTERNAL_MANIFESTS:-}
      PYTHONPATH: /app/sdk/python
      PLATFORM_RUNNER_MODE: worker
      WORKER_ID: ${WORKER_ID:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      AGENT_A2A_ALLOWED_EDGES: ${AGENT_A2A_ALLOWED_EDGES:-}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-team6}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-team6}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
