# vdagent PoC (spec §12). `docker compose up --build`, then open http://localhost:8000.
# The backend runs the five agents in-process as plugins (backend/config.compose.yaml). Each plugin
# reads its own agents/<name>/.env (OPENAI_API_KEY, OPENAI_BASE_URL, LLM_MODEL); .env files are kept
# out of the image, so they are mounted read-only where the plugins look for them.

x-python: &python
  build:
    context: .
    dockerfile: Dockerfile.python
  image: vdagent-python:latest
  volumes:
    - ./var:/app/var

services:
  seed:
    <<: *python
    command: ["sh", "-c", "python data/seed_warehouse.py && python data/seed_users.py"]
    environment:
      VDAGENT_CONFIG: /app/backend/config.compose.yaml
    restart: "no"

  backend:
    <<: *python
    command: ["uvicorn", "vdagent_backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      VDAGENT_CONFIG: /app/backend/config.compose.yaml
    volumes:
      - ./var:/app/var
      - ./agents/orchestrator/.env:/app/agents/orchestrator/.env:ro
      - ./agents/data/.env:/app/agents/data/.env:ro
      - ./agents/compare/.env:/app/agents/compare/.env:ro
      - ./agents/insight/.env:/app/agents/insight/.env:ro
      - ./agents/report/.env:/app/agents/report/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
