# vdagent (spec §12). One application image; the Backend runs all 6 agent plugins in-process (no per-agent services).
#
# Product (default):  make up   → UI + API on http://localhost:${VDAGENT_PORT:-8000}, app data in volume vdagent_real_var
#   Reads the REAL PostgreSQL warehouse: VDAGENT_RE_WAREHOUSE_DB, ORCH_SNAPSHOT_ID and ORCH_SEMANTIC_VERSION come from the
#   root .env (cp .env.example .env). `warehouse-check` proves from inside Docker that the warehouse is reachable and
#   holds the pinned APPROVED snapshot before the Backend starts; there is no fallback to the synthetic mock.
#   The Makefile always passes `-f docker-compose.yml`, so a stray docker-compose.override.yml is never merged.
# Synthetic mock (explicit): make mock-up → http://localhost:8001 (profile offline, no keys, deterministic)
# Offline tests:             make docker-test
#
# Seeding never overwrites a populated database (docker/seed-if-missing.sh).

x-python: &python
  build:
    context: .
    dockerfile: Dockerfile.python
    target: runtime
  image: vdagent-python:latest

services:
  seed:
    <<: *python
    command: ["sh", "docker/seed-if-missing.sh"]
    environment:
      VDAGENT_CONFIG: /app/backend/config.compose.yaml
      VDAGENT_SCOPE_PROFILE: "real"         # demo users see the real warehouse's projects (data/seed_users.py)
      SEED_RE_MOCK: "off"                   # never build the synthetic real-estate DW for this stack
    volumes:
      - app-var:/app/var
    restart: "no"

  warehouse-check:                          # the real warehouse is reachable from Docker and holds the pinned snapshot
    <<: *python
    command: ["python", "docker/check_warehouse.py"]
    env_file:
      - path: .env
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway" # a PostgreSQL on the developer's machine
    restart: "no"

  backend:
    <<: *python
    env_file:
      - path: .env                          # LLM keys, VDAGENT_RE_WAREHOUSE_DB, ORCH_SNAPSHOT_ID, ORCH_SEMANTIC_VERSION
        required: true
    environment:
      VDAGENT_CONFIG: /app/backend/config.compose.yaml
      ORCH_LLM: "on"                        # LLM planner → validated plan → DAG (never the legacy loop)
      ORCH_DAG_TIMEOUT_S: "300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-var:/app/var
    ports:
      - "${VDAGENT_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      warehouse-check:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---- isolated offline smoke environment (profile: offline) -------------------------------------------------
  seed-offline:
    <<: *python
    profiles: ["offline"]
    command: ["sh", "docker/seed-if-missing.sh"]
    environment:
      VDAGENT_CONFIG: /app/backend/config.compose.yaml
      VDAGENT_RE_WAREHOUSE_DB: ./var/re_warehouse.db   # the synthetic mock, named explicitly (never the product path)
    volumes:
      - offline-var:/app/var
    restart: "no"

  backend-offline:
    <<: *python
    profiles: ["offline"]
    environment:
      VDAGENT_CONFIG: /app/backend/config.compose.yaml
      VDAGENT_RE_WAREHOUSE_DB: ./var/re_warehouse.db   # the synthetic mock, named explicitly (never the product path)
      INSIGHT_LLM: "off"
      COMPARE_LLM: "off"
      DATA_LLM: "off"          # data serves StepSpec@1 deterministically without keys (WS2)
      ORCH_LLM: "off"          # orchestrator runs the deterministic DAG without keys (WS5)
      REPORT_LLM: "off"        # report serves evidence-checked StepSpec@1 without keys (WS6)
      ORCH_SNAPSHOT_ID: "SNAP-2026-09-28"   # explicit pin for free-text DAG runs; never "latest" (golden snapshot)
      ORCH_SEMANTIC_VERSION: "sc-1"
    volumes:
      - offline-var:/app/var
    ports:
      - "8001:8000"
    depends_on:
      seed-offline:
        condition: service_completed_successfully

  # ---- offline test suite (profile: test) ----------------------------------------------------------------------
  tests:
    build:
      context: .
      dockerfile: Dockerfile.python
      target: test
    image: vdagent-python-test:latest
    profiles: ["test"]
    environment:
      INSIGHT_LLM: "off"
      COMPARE_LLM: "off"
    tmpfs:
      - /app/var
    network_mode: none   # offline by construction: no external API can be reached

volumes:
  app-var:
    name: vdagent_real_var
  offline-var:
    name: ${VDAGENT_OFFLINE_VOLUME:-vdagent_offline_var}   # disposable; override for isolated verification runs
