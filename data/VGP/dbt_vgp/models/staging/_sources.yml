    description: >
      Nguon du lieu tho VGP mock (17 file CSV sinh boi generate_vgp_mock.py).
      Moi table duoc dbt-duckdb dang ky nhu 1 view ngoai (external_location)
      tro thang vao file CSV - khong copy du lieu vao warehouse.
      LUU Y: external_location dung DUONG DAN TUONG DOI (../data/...), tinh tu
      thu muc lam viec khi chay `dbt build` (luon la dbt_vgp/ - xem README "Chay").
      KHONG dung duong dan tuyet doi de project di chuyen duoc sang may/thu muc
      khac ma khong phai sua gi.
