version: 2

models:
  - name: dm_unit_friction_diagnostics
    description: >
      Ban SQL/dbt cua ma tran 8 nguyen nhan cot loi - tinh lai tu dau bang SQL
      (khong phai chi doc lai ket qua Python). Dung de doi chieu voi
      dm_unit_friction_diagnostics_python (nguon 15_dm_unit_friction_diagnostics.csv).
    columns:
      - name: diagnostic_id
        tests:
          - unique
          - not_null
      - name: unit_key
        tests:
          - not_null
          - relationships:
              to: source('raw', 'dim_unit_master')
              field: unit_key
      - name: primary_cause_code
        tests:
          - not_null
          - accepted_values:
              values:
                - LEGAL_PERMIT_BARRIER
                - SEVERE_PHYSICAL_DEFECT
                - EXTREME_THERMAL_EXPOSURE
                - SECONDARY_ARBITRAGE
                - LUMP_SUM_TICKET_BARRIER
                - OVERPRICED_VS_PEER
                - LOW_SALES_INCENTIVE
                - DEEP_FUNNEL_DROP_OFF
                - MULTI_FACTOR_UNCLASSIFIED
      - name: unsold_days_dom
        tests:
          - not_null

  - name: int_peer_median
    columns:
      - name: peer_median_ppm2
        tests:
          - not_null

  - name: int_defect_thermal_penalty
    columns:
      - name: unit_key
        tests:
          - unique
          - not_null
      - name: physical_defect_penalty
        tests:
          - not_null
      - name: thermal_view_penalty
        tests:
          - not_null

  - name: int_active_snapshot
    description: >
      Helper 1 dong xac dinh kỳ snapshot ACTIVE - nguon duy nhat cho khai
      niem "active", cac model khac PHAI ref() toi day thay vi hardcode ngay.
    columns:
      - name: active_snapshot_date_key
        tests:
          - not_null

  - name: mart_channel_attribution_performance
    description: >
      Mart consolidation moi - tong hop hieu suat tung san phan phoi (channel)
      tu bang Bridge (so can duoc/dang giao phu trach) va Attribution (so
      touchpoint/tong trong so dong gop vao giao dich ban thanh cong). Grain:
      1 dong / 1 channel_key, tong hop toan bo lich su (khong theo ky snapshot).
      Dung de tra loi: "san nao dang giu nhieu can nhat", "san nao dong gop
      nhieu vao chuyen doi nhat theo attribution". KHONG lien quan/khong dung
      lai logic ma tran 8 nguyen nhan cua dm_unit_friction_diagnostics.
    columns:
      - name: channel_key
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_dim_sales_channel')
              field: channel_key
      - name: units_ever_assigned
        tests:
          - not_null
      - name: total_attribution_weight
        tests:
          - not_null
