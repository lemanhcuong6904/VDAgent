[project]
name = "vdagent-contracts"
version = "0.1.0"
description = "vdagent shared contracts: Pydantic models, canonical JSON and content hashing (pydantic only)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_contracts"]
