# docker-compose variant of config.yaml. Agents run inside the backend container as plugins, so
# their MCP clients reach this Backend on localhost. Relative paths resolve from the container
# working dir (/app).
backend_db: ./var/backend.db
warehouse_db: ./var/warehouse.db
# re_warehouse_db: never set here. VDAGENT_RE_WAREHOUSE_DB gives the real DSN (.env) or, for tests/offline only,
# the explicit SQLite mock path (./var/re_warehouse.db); unset or malformed stops the Backend at startup.
mcp_public_url: http://localhost:8000/mcp       # URL plugins' MCP clients use
frontend_dist: ./frontend/dist                  # served at / if present
max_depth: 4
max_steps: 12
plugins:
  # mcp_tools = the WS1–WS7 permission matrix: every agent reads/writes artifacts (artifact_* : only its own types,
  # enforced by the artifact handlers) and reads its user's scope; only Data queries the warehouses.
  - module: vdagent_orchestrator
    mcp_tools: [describe_dataset, get_dataset_rows, artifact_put, artifact_get, artifact_list, get_user_context]
  - module: vdagent_data
    mcp_tools: [list_tables, describe_table, run_query, query_datasets, describe_dataset, get_dataset_rows,
                artifact_put, artifact_get, artifact_list, get_user_context, re_list_tables, re_describe_table, re_run_query]
  - module: vdagent_compare
    mcp_tools: [query_datasets, describe_dataset, get_dataset_rows, artifact_put, artifact_get, artifact_list, get_user_context]
  - module: vdagent_insight
    mcp_tools: [query_datasets, describe_dataset, get_dataset_rows, artifact_put, artifact_get, artifact_list, get_user_context]
  - module: vdagent_report
    mcp_tools: [create_chart, save_report, describe_dataset, get_dataset_rows, artifact_put, artifact_get, artifact_list,
                get_user_context]
  # Chart (D6, WS4): StepSpec@1 draw_chart over real artifacts. Demo commands (`chart demo`, `chart ask`) are off
  # unless CHART_DEMO=on in agents/chart/.env or `opts: {demo: true}` — never in production.
  - module: vdagent_chart
    mcp_tools: [describe_dataset, get_dataset_rows, artifact_put, artifact_get, artifact_list, get_user_context]
