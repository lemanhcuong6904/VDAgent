backend_db: ./var/backend.db
warehouse_db: ./var/warehouse.db
re_warehouse_db: ./var/re_warehouse.db             # real-estate DW mock (data/seed_re_warehouse.py)
mcp_public_url: http://localhost:8000/mcp       # URL plugins' MCP clients use (this Backend's own /mcp)
frontend_dist: ./frontend/dist                  # served at / if present
max_depth: 4
max_steps: 12
# Agent plugins, loaded in this order at startup. Each module must export setup(api, opts) and is
# configured by its own agents/<name>/.env. A plugin that fails to load is logged and skipped.
plugins:
  - module: vdagent_orchestrator
  - module: vdagent_data
  - module: vdagent_compare
  - module: vdagent_insight
  - module: vdagent_report
  # Chart (D6, WS4): StepSpec@1 draw_chart over real artifacts. Demo commands (`chart demo`, `chart ask`) are off
  # unless CHART_DEMO=on in agents/chart/.env or `opts: {demo: true}` — never in production.
  - module: vdagent_chart
  # - module: agent_template   # echo agent; copy agents/_template to start a new plugin
  #   opts: {name: echo}
