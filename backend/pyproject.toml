[project]
name = "vdagent-backend"
version = "0.1.0"
description = "vdagent Backend: FastAPI REST/SSE, invocation engine, MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vdagent-sdk",
  "vdagent-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "python-dotenv>=1.0",
  "mcp>=1.9",
  "pyyaml>=6",
  "sqlite-vec>=0.1.6",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "sqlglot>=25",
]

[tool.uv.sources]
vdagent-sdk = { workspace = true }
vdagent-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdagent_backend"]
