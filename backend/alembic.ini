# Alembic CLI config for the Backend database. The app migrates itself at startup (persistence.migrate);
# use the CLI to write revisions, e.g. from the repository root:
#
#   uv run alembic -c backend/alembic.ini -x url=sqlite+aiosqlite:///var/backend.db revision --autogenerate -m "add x"
#
# Autogenerate against a database created by the migrations (`make reset-db`); a pre-Alembic database
# adopted in place differs in SQLite-only details (nullable TEXT primary keys, INTEGER booleans).

[alembic]
script_location = %(here)s/vdagent_backend/persistence/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///var/backend.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
